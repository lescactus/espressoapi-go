name: Run e2e tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      matrix:
          database: [mysql, postgres]
          testsuites:
            - venom.e2e.roasters.yaml
            - venom.e2e.sheets.yaml
            - venom.e2e.beans.yaml
            - venom.e2e.shots.yaml
            - venom.e2e.web.yaml
            - venom.e2e.swagger.yaml
    runs-on: ubuntu-latest
    env:
      DATABASE_TYPE: ${{ matrix.database }}
      DATABASE_DATASOURCE_NAME: ${{ matrix.database == 'mysql' && 'root:root@tcp(127.0.0.1:3306)/espresso-api?parseTime=true' || 'postgres://root:root@127.0.0.1:5432/espresso-api?sslmode=disable' }}
      E2E_DATABASE_DSN: ${{ matrix.database == 'mysql' && 'root:root@tcp(127.0.0.1:3306)/espresso-api?parseTime=true' || 'postgres://root:root@127.0.0.1:5432/espresso-api?sslmode=disable' }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26"
        cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install venom
      run: |
        curl https://github.com/ovh/venom/releases/download/v1.1.0/venom.linux-amd64 -L -o /usr/local/bin/venom && chmod +x /usr/local/bin/venom
        venom version

    - name: Docker compose up
      run: |
        docker compose --profile ${{ matrix.database }} build --pull
        docker compose --profile ${{ matrix.database }} up -d --wait --no-recreate

    - name: Run sql migrations
      run: go run main.go migrate up

    - name: Verify database enum constraints
      if: matrix.testsuites == 'venom.e2e.beans.yaml'
      run: go test -tags=integration ./e2e

    - name: Run e2e tests with venom
      run: |
        export IS_TTY=true
        venom run -vv ./e2e/${{ matrix.testsuites }}

    - name: Debug when failure happened
      if: ${{ failure() }}
      run: docker compose --profile ${{ matrix.database }} logs

    - name: Docker compose down
      if: ${{ always() }}
      run: docker compose --profile ${{ matrix.database }} down -v