name: Go build and test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        version: ["1.25", "1.26"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.version }}
        cache: true

    - name: Build
      run: go build -v ./...
      
  test:
    strategy:
        matrix:
          version: ["1.25", "1.26"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.version }}
        cache: true

    - name: Unit tests
      run: go test -v ./...

  race-condition:
    strategy:
      matrix:
        version: ["1.25", "1.26"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.version }}
        cache: true
    
    - name: Test race condition
      run: go test -race -vet=off ./...

  templ-drift:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26"
        cache: true

    - name: Install templ CLI
      run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

    - name: Generate templ files
      run: templ generate

    - name: Fail on generated-file drift
      run: git diff --exit-code

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max